<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ออฟไลน์อยู่</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100svh; display: grid; place-items: center;
    background: #f7f8fa; color: #1b2027;
    font-family: 'IBM Plex Sans Thai', system-ui, -apple-system, sans-serif;
    line-height: 1.5; padding: 24px;
  }
  @media (prefers-color-scheme: dark) { body { background: #12161c; color: #e6e9ee; } }
  .box { max-width: 22rem; text-align: center; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { margin: 0; font-size: 15px; opacity: .75; }
  .hat { width: 56px; height: 56px; margin: 0 auto 16px; display: block; }
</style>
</head>
<body>
  <div class="box">
    <svg class="hat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M2 18h20"/><path d="M10 10V5a2 2 0 0 1 4 0v5"/>
      <path d="M4 18a8 8 0 0 1 16 0"/>
    </svg>
    <h1>ตอนนี้ออฟไลน์อยู่</h1>
    <p>หน้านี้ต้องใช้อินเทอร์เน็ต — ต่อสัญญาณแล้วลองใหม่อีกครั้ง
       รายการที่บันทึกไว้แล้วยังอยู่ครบ</p>
  </div>
</body>
</html>
